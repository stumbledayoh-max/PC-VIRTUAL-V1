          OEM_WALLPAPER_B64

          # .bat e .ps1 precisam de fim de linha do Windows (CRLF)
          sed -i 's/$/\r/' "$OEM/install.bat" "$OEM/setwall.ps1" "$OEM/activate.ps1"
          ls -l "$OEM"
          file "$OEM/wallpaper.png" || true

      # ─────────────────────────────────────────────
      # 1. ESTADO ANTERIOR (JSON)
      # ─────────────────────────────────────────────
      - name: Restore system state (JSON)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/rdp-state/system-state.json
          key: win-state-${{ env.VERSION_CODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-state-${{ env.VERSION_CODE }}-

      - name: Init state
        run: |
          mkdir -p /home/runner/rdp-state
          echo "STATE_FILE=/home/runner/rdp-state/system-state.json" >> $GITHUB_ENV
          # Hora limite do loop: 315 min após o início (sobra ~45 min para desligar e salvar)
          echo "DEADLINE=$(( $(date +%s) + 18900 ))" >> $GITHUB_ENV
          cat > /home/runner/state.py <<'EOF'
          import json, os, sys, datetime
          p = os.environ["STATE_FILE"]
          now = datetime.datetime.now().astimezone().isoformat()
          s = json.load(open(p)) if os.path.exists(p) else {}
          step = sys.argv[1]
          if step == "init":
              prev = s
              if prev: print("Estado anterior encontrado: execução #%s" % prev.get("run_count"))
              else:    print("Sem estado anterior (primeira execução).")
              s = {
                  "schema": 1,
                  "run_count": int(prev.get("run_count", 0)) + 1,
                  "first_started": prev.get("first_started", now),
                  "started_at": now,
                  "previous_run": ({k: prev.get(k) for k in ("last_update", "ticks", "steps")} if prev else None),
                  "steps": {}, "ticks": 0,
              }
          else:
              s.setdefault("steps", {})
              if step != "-": s["steps"][step] = now
          for kv in sys.argv[2:]:
              k, _, v = kv.partition("=")
              s[k] = int(v) if v.isdigit() else v
          s["last_update"] = now
          os.makedirs(os.path.dirname(p), exist_ok=True)
          json.dump(s, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          STATE_FILE=/home/runner/rdp-state/system-state.json python3 /home/runner/state.py init version=${{ env.VERSION_CODE }}

      # ─────────────────────────────────────────────
      # 2. KVM + DISCO + SWAP
      # ─────────────────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error::Este runner não tem /dev/kvm. Use repositório público ou um runner maior."
            exit 1
          fi
          ls -l /dev/kvm
          python3 /home/runner/state.py kvm

      - name: Free disk space + swap
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/windows
          sudo chown -R "$USER" /mnt/windows

          # Swap de 8GB: evita o kernel matar a VM por falta de memória
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt
          python3 /home/runner/state.py disk_ready

      # ─────────────────────────────────────────────
      # 3. RESTAURAR APPS E DADOS (disco salvo na Release)
      # ─────────────────────────────────────────────
      - name: Restore Windows disk (Release)
        if: ${{ inputs.persist }}
        run: |
          PREFIX="disk-${{ env.VERSION_CODE }}-"
          TAG=$(gh release list --limit 100 --json tagName,createdAt \
                  --jq "[.[] | select(.tagName | startswith(\"$PREFIX\"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty")
          if [ -z "$TAG" ]; then
            echo "Nenhum disco salvo para ${{ env.VERSION_CODE }} (primeira vez: o Windows será instalado)."
            exit 0
          fi
          echo "Restaurando disco da release: $TAG"
          mkdir -p /mnt/parts
          gh release download "$TAG" --pattern 'win.tar.zst.part*' --dir /mnt/parts
          ls -lh /mnt/parts
          cat /mnt/parts/win.tar.zst.part* | zstd -d -T0 | sudo tar -x --sparse -C /mnt
          rm -rf /mnt/parts
          sudo chown -R "$USER" /mnt/windows
          echo "DISK_RESTORED=1" >> $GITHUB_ENV
          python3 /home/runner/state.py disk_restored restored_tag=$TAG
          du -sh /mnt/windows; df -h /mnt

      # ─────────────────────────────────────────────
      # 4. TAILSCALE
      # ─────────────────────────────────────────────
      - name: Connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-${{ env.VERSION_CODE }}-${{ github.run_id }}
          for i in $(seq 1 15); do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -1)
            [ -n "$TS_IP" ] && break
            sleep 4
          done
          [ -z "$TS_IP" ] && { echo "::error::Tailscale sem IP"; exit 1; }
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV
          python3 /home/runner/state.py tailscale_up tailscale_ip=$TS_IP
          echo "Tailscale IP: $TS_IP"

      # ─────────────────────────────────────────────
      # 5. INICIAR O WINDOWS NO DOCKER
      # ─────────────────────────────────────────────
      - name: Start Windows container
        env:
          IN_VERSION: ${{ env.VERSION_CODE }}
          IN_USER: ${{ inputs.username }}
          IN_PASS: ${{ inputs.password }}
          IN_RAM: ${{ inputs.ram }}
          IN_CORES: ${{ inputs.cores }}
          IN_DISK: ${{ inputs.disk }}
          WIN_KEY: ${{ secrets.WINDOWS_KEY }}
        run: |
          # Key de ativação (opcional): secret WINDOWS_KEY. Nunca é impressa no log.
          mkdir -p /home/runner/shared
          KEY_ARG=()
          if [ -n "$WIN_KEY" ]; then
            (umask 077; printf '%s' "$WIN_KEY" > /home/runner/shared/activate.key)
            KEY_ARG=(-e KEY="$WIN_KEY")   # o dockur usa na instalação
            echo "HAS_KEY=1" >> $GITHUB_ENV
            echo "Key de ativação recebida (secret WINDOWS_KEY)."
          else
            echo "Sem secret WINDOWS_KEY: o Windows fica sem ativar / em avaliação."
          fi

          # Campos vazios no formulário viram CrowCloud
          WIN_USER="${IN_USER:-CrowCloud}"
          WIN_PASS="${IN_PASS:-CrowCloud}"
          echo "WIN_USER=$WIN_USER" >> $GITHUB_ENV
          echo "WIN_PASS=$WIN_PASS" >> $GITHUB_ENV

          # /oem: o install.bat (criado na etapa 0) roda no fim da instalação e aplica o wallpaper CrowCloud
          docker run -d --name windows \
            --device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN \
            -p 8006:8006 -p 3389:3389/tcp -p 3389:3389/udp \
            -e VERSION="$IN_VERSION" \
            -e USERNAME="$WIN_USER" -e PASSWORD="$WIN_PASS" \
            -e RAM_SIZE="$IN_RAM" -e CPU_CORES="$IN_CORES" -e DISK_SIZE="$IN_DISK" \
            -e ALLOCATE=N \
            -v /mnt/windows:/storage \
            -v /home/runner/oem:/oem \
            -v /home/runner/shared:/shared \
            "${KEY_ARG[@]}" \
            --stop-timeout 180 \
            dockurr/windows
          sleep 10
          docker ps
          python3 /home/runner/state.py container_started

      - name: Show access info
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║         CROWCLOUD — WINDOWS DOCKER           ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  NAVEGADOR: http://$TS_IP:8006"
          echo "║  RDP:       $TS_IP:3389"
          echo "║  Usuário:   $WIN_USER"
          echo "║  Senha:     $WIN_PASS"
          if [ "$HAS_KEY" = "1" ]; then
            echo "║  Ativação:  automática (key do secret)       ║"
          else
            echo "║  Ativação:  sem key (crie o secret WINDOWS_KEY)║"
          fi
          if [ "$DISK_RESTORED" = "1" ]; then
            echo "╠══════════════════════════════════════════════╣"
            echo "║  Disco RESTAURADO: apps e dados voltaram.    ║"
            echo "║  Usuário/senha são os da 1ª instalação.      ║"
          else
            echo "╠══════════════════════════════════════════════╣"
            echo "║  Instalação nova (20 a 40 min). Acompanhe    ║"
            echo "║  pelo navegador no endereço acima.           ║"
          fi
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Para encerrar COM SEGURANÇA: desligue o     ║"
          echo "║  Windows pelo menu Iniciar (salva tudo).     ║"
          echo "╚══════════════════════════════════════════════╝"
          echo ""

      - name: Wait for Windows
        run: |
          ok=0
          for i in $(seq 1 90); do
            if docker logs windows 2>&1 | grep -qi "Windows started successfully"; then ok=1; break; fi
            if [ -z "$(docker ps -q -f name=windows)" ]; then
              echo "::error::O contêiner parou."; docker logs --tail 60 windows; exit 1
            fi
            echo "[$(date +%T)] aguardando... $(docker logs --tail 1 windows 2>&1 | tr -d '\r' | cut -c1-100)"
            sleep 60
          done
          if [ "$ok" = "1" ]; then
            echo "Windows PRONTO ✓  -> http://$TS_IP:8006  |  RDP $TS_IP:3389"
            python3 /home/runner/state.py windows_ready
          else
            echo "::warning::Tempo de espera esgotado; o Windows pode ainda estar instalando. Veja pelo navegador."
          fi

      # ─────────────────────────────────────────────
      # 6. MANTER ATIVO (até a hora limite ou o Windows ser desligado)
      # ─────────────────────────────────────────────
      - name: Keep alive
        run: |
          i=0
          END_REASON=timeout
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ -z "$(docker ps -q -f name=windows)" ]; then
              echo "O Windows foi desligado. Salvando tudo..."
              END_REASON=shutdown; break
            fi
            i=$((i+1))
            FREE=$(df -BG /mnt | awk 'NR==2{print $4}')
            LEFT=$(( (DEADLINE - $(date +%s)) / 60 ))
            python3 /home/runner/state.py keepalive ticks=$i disk_free=$FREE
            echo "[$(date +%T)] Ativo — tick $i | /mnt livre: $FREE | restam ~${LEFT} min | http://$TS_IP:8006"
            sleep 300
          done
          [ "$END_REASON" = "timeout" ] && echo "Tempo máximo atingido, encerrando para salvar."
          echo "END_REASON=$END_REASON" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 7. DESLIGAR LIMPO E SALVAR (roda mesmo se cancelar)
      # ─────────────────────────────────────────────
      - name: Stop Windows cleanly
        if: always()
        run: |
          python3 /home/runner/state.py ended || true
          docker stop -t 180 windows || true
          rm -f /home/runner/shared/activate.key
          sudo chmod -R a+rX /mnt/windows || true
          du -sh /mnt/windows || true

      - name: Save Windows disk (Release)
        if: ${{ always() && inputs.persist }}
        run: |
          [ -d /mnt/windows ] || { echo "Sem disco para salvar."; exit 0; }
          # Só salva se o Windows chegou a ser instalado (evita guardar disco vazio)
          if [ ! -f /mnt/windows/data.img ] && [ -z "$(ls -A /mnt/windows 2>/dev/null)" ]; then
            echo "Disco vazio, nada a salvar."; exit 0
          fi
          PREFIX="disk-${{ env.VERSION_CODE }}-"
          NEWTAG="${PREFIX}${{ github.run_id }}"
          rm -rf /mnt/parts; mkdir -p /mnt/parts

          echo "Comprimindo o disco..."
          sudo tar --sparse -C /mnt -cf - windows | zstd -T0 -3 | split -b 1900M -d -a 3 - /mnt/parts/win.tar.zst.part
          ls -lh /mnt/parts

          echo "Enviando para a release $NEWTAG..."
          gh release create "$NEWTAG" /mnt/parts/win.tar.zst.part* \
            --title "Disco do Windows (${{ env.VERSION_CODE }}) — run ${{ github.run_id }}" \
            --notes "Disco da VM salvo automaticamente (apps e dados). Não apague: é restaurado na próxima execução." \
            --prerelease --latest=false

          # Só apaga os backups antigos depois que o novo subiu com sucesso
          for old in $(gh release list --limit 100 --json tagName --jq ".[].tagName | select(startswith(\"$PREFIX\"))"); do
            if [ "$old" != "$NEWTAG" ]; then
              echo "Removendo backup antigo: $old"
              gh release delete "$old" -y --cleanup-tag || true
            fi
          done
          python3 /home/runner/state.py disk_saved saved_tag=$NEWTAG || true

      - name: Save system state (JSON)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/rdp-state/system-state.json
          key: win-state-${{ env.VERSION_CODE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-state-${{ env.VERSION_CODE }}
          path: /home/runner/rdp-state/system-state.json
          retention-days: 30

      # ─────────────────────────────────────────────
      # 8. MODO SERVIDOR: começa outra execução sozinho
      #    (só se terminou por tempo; se você desligou o Windows, não reinicia)
      # ─────────────────────────────────────────────
      - name: Restart (server mode)
        if: ${{ success() && inputs.auto_restart && inputs.persist }}
        run: |
          if [ "$END_REASON" = "timeout" ]; then
            echo "Disparando a próxima execução..."
            gh workflow run "${{ github.workflow }}" \
              -f version="${{ inputs.version }}" \
              -f username="${{ inputs.username }}" \
              -f password="${{ inputs.password }}" \
              -f ram="${{ inputs.ram }}" -f cores="${{ inputs.cores }}" -f disk="${{ inputs.disk }}" \
              -f persist=true -f auto_restart=true
          else
            echo "Windows desligado manualmente: não reinicia."
          fi
