# ═══════════════════════════════════════════════════════════════
#  CROWCLOUD — Windows / Linux / macOS / Android em Docker (arquivo único)
#  Salve como: .github/workflows/windows-docker.yml
#  Secrets: TAILSCALE_AUTH_KEY (obrigatório) | WINDOWS_KEY (opcional, só Windows)
#
#  ATENÇÃO: na etapa "Create OEM files" há uma linha
#  COLE_AQUI_O_BASE64_DO_WALLPAPER. Troque pelo base64 do seu wallpaper.png
#  (o mesmo do arquivo antigo). Se deixar assim, o Windows só fica sem wallpaper.
# ═══════════════════════════════════════════════════════════════
name: Windows Docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sistema (Windows instala sozinho; Linux/macOS você instala pelo navegador)"
        type: choice
        default: "10 - Windows 10 Pro"
        options:
          # ── Linux (instalação manual pelo navegador) ──
          - "linux:ubuntu - Linux Ubuntu"
          - "linux:debian - Linux Debian"
          - "linux:fedora - Linux Fedora"
          - "linux:kali - Linux Kali"
          - "linux:mint - Linux Mint"
          - "linux:alpine - Linux Alpine (muito leve)"
          # ── macOS / Hackintosh (instalação manual pelo navegador) ──
          - "mac:15 - macOS 15 Sequoia"
          - "mac:14 - macOS 14 Sonoma"
          - "mac:13 - macOS 13 Ventura"
          - "mac:12 - macOS 12 Monterey"
          - "mac:11 - macOS 11 Big Sur"
          # ── Android (emulador, sem persistência) ──
          - "android:14.0 - Android 14"
          - "android:13.0 - Android 13"
          - "android:12.0 - Android 12"
          - "android:11.0 - Android 11"
          - "android:10.0 - Android 10"
          # ── Windows 11 ──
          - "11 - Windows 11 Pro (completo, sem ativação)"
          - "11l - Windows 11 LTSC (enxuto, suporte longo, avaliação)"
          - "11e - Windows 11 Enterprise (corporativo, avaliação)"
          # ── Windows 10 ──
          - "10 - Windows 10 Pro"
          - "10l - Windows 10 LTSC (enxuto, suporte longo, avaliação)"
          - "10e - Windows 10 Enterprise (corporativo, avaliação)"
          # ── Windows Server (avaliação de 180 dias) ──
          - "2025 - Windows Server 2025 (mais novo)"
          - "2022 - Windows Server 2022"
          - "2019 - Windows Server 2019"
          - "2016 - Windows Server 2016"
          - "2012 - Windows Server 2012 (antigo)"
          - "2008 - Windows Server 2008 (muito antigo)"
          - "2003 - Windows Server 2003 (muito antigo, leve)"
          # ── Windows antigos (sem suporte; wallpaper/ativação podem não funcionar) ──
          - "8e - Windows 8.1 Enterprise (antigo)"
          - "7u - Windows 7 Ultimate (antigo)"
          - "vu - Windows Vista Ultimate (antigo)"
          - "xp - Windows XP Professional (muito antigo, leve)"
          - "2k - Windows 2000 Professional (muito antigo, sem RDP)"
      username:
        description: "Usuário do Windows (vazio = CrowCloud). Só vale no Windows, na 1ª instalação"
        type: string
        default: ""
      password:
        description: "Senha do Windows (vazio = CrowCloud). Só vale no Windows, na 1ª instalação"
        type: string
        default: ""
      ram:
        description: "RAM da VM (máx. no repo público: 13G de 16G. Repo privado: use 4G)"
        type: string
        default: 13G
      cores:
        description: "CPUs da VM (máx. no repo público: 4. Repo privado: use 2)"
        type: string
        default: "4"
      disk:
        description: "Tamanho do disco da VM (esparso; ~65GB livres no runner)"
        type: string
        default: 80G
      persist:
        description: "Salvar apps e dados (disco inteiro) em uma Release do repositório (não vale para Android)"
        type: boolean
        default: true
      auto_restart:
        description: "Ao fim das ~5h, iniciar outra execução sozinho (modo servidor)"
        type: boolean
        default: false

permissions:
  contents: write   # Releases (onde o disco é salvo)
  actions: write    # reiniciar o workflow (auto_restart)

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ─────────────────────────────────────────────
      # 00. RESOLVE O SISTEMA (família, imagem, porta)
      # ─────────────────────────────────────────────
      - name: Resolve system
        env:
          IN_VERSION_LABEL: ${{ inputs.version }}
        run: |
          CODE="${IN_VERSION_LABEL%% *}"
          case "$CODE" in
            linux:*)   FAMILY=linux;   IMAGE=qemux/qemu;     OS_ID="${CODE#linux:}"; WEB_PORT=8006 ;;
            mac:*)     FAMILY=macos;   IMAGE=dockurr/macos;  OS_ID="${CODE#mac:}";   WEB_PORT=8006 ;;
            android:*) FAMILY=android; IMAGE="budtmo/docker-android:emulator_${CODE#android:}"; OS_ID="${CODE#android:}"; WEB_PORT=6080 ;;
            *)         FAMILY=windows; IMAGE=dockurr/windows; OS_ID="$CODE";          WEB_PORT=8006 ;;
          esac
          # usado nos nomes de cache/release (sem ":")
          echo "VERSION_CODE=${CODE//:/-}" >> $GITHUB_ENV
          echo "FAMILY=$FAMILY"     >> $GITHUB_ENV
          echo "IMAGE=$IMAGE"       >> $GITHUB_ENV
          echo "OS_ID=$OS_ID"       >> $GITHUB_ENV
          echo "WEB_PORT=$WEB_PORT" >> $GITHUB_ENV
          echo "Sistema: $IN_VERSION_LABEL | família: $FAMILY | imagem: $IMAGE"

      # ─────────────────────────────────────────────
      # 0. ARQUIVOS DO WINDOWS (wallpaper + scripts), só para Windows
      # ─────────────────────────────────────────────
      - name: Create OEM files (wallpaper CrowCloud + scripts)
        if: ${{ env.FAMILY == 'windows' }}
        run: |
          OEM=/home/runner/oem
          mkdir -p "$OEM"

          cat > "$OEM/install.bat" <<'OEM_INSTALL_BAT'
          @echo off
          rem === CrowCloud: aplica o wallpaper quando o Windows e criado ===
          if not exist "%~dp0wallpaper.png" goto activation

          set "DSTDIR=C:\Windows\Web\Wallpaper\CrowCloud"
          set "DST=%DSTDIR%\crowcloud.png"

          mkdir "%DSTDIR%" 2>nul
          copy /Y "%~dp0wallpaper.png" "%DST%" >nul

          rem Usuario atual
          reg add "HKCU\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "%DST%" /f >nul
          reg add "HKCU\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d 10 /f >nul
          reg add "HKCU\Control Panel\Desktop" /v TileWallpaper /t REG_SZ /d 0 /f >nul

          rem Perfil padrao (todo usuario novo ja nasce com o wallpaper)
          reg load HKU\CrowDefault "C:\Users\Default\NTUSER.DAT" >nul 2>&1
          if not errorlevel 1 (
            reg add "HKU\CrowDefault\Control Panel\Desktop" /v Wallpaper /t REG_SZ /d "%DST%" /f >nul
            reg add "HKU\CrowDefault\Control Panel\Desktop" /v WallpaperStyle /t REG_SZ /d 10 /f >nul
            reg add "HKU\CrowDefault\Control Panel\Desktop" /v TileWallpaper /t REG_SZ /d 0 /f >nul
            reg unload HKU\CrowDefault >nul 2>&1
          )

          rem Aplica agora, sem precisar reiniciar
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0setwall.ps1"

          :activation
          rem Ativacao automatica: tarefa que roda a cada boot (usa \\host.lan\Data\activate.key)
          copy /Y "%~dp0activate.ps1" "C:\OEM\" >nul 2>&1
          schtasks /Create /TN "CrowCloud-Activate" /TR "powershell -NoProfile -ExecutionPolicy Bypass -File C:\OEM\activate.ps1" /SC ONSTART /DELAY 0001:00 /RU SYSTEM /RL HIGHEST /F >nul 2>&1
          schtasks /Run /TN "CrowCloud-Activate" >nul 2>&1
          exit /b 0
          OEM_INSTALL_BAT

          cat > "$OEM/setwall.ps1" <<'OEM_SETWALL_PS1'
          $dst = "C:\Windows\Web\Wallpaper\CrowCloud\crowcloud.png"
          Add-Type @"
          using System.Runtime.InteropServices;
          public class CrowWall {
            [DllImport("user32.dll", CharSet = CharSet.Auto)]
            public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          # 20 = SPI_SETDESKWALLPAPER, 3 = grava no perfil + avisa as janelas
          [CrowWall]::SystemParametersInfo(20, 0, $dst, 3) | Out-Null
          OEM_SETWALL_PS1

          cat > "$OEM/activate.ps1" <<'OEM_ACTIVATE_PS1'
          # CrowCloud: ativa o Windows com a key fornecida em \\host.lan\Data\activate.key
          $log = "C:\OEM\activate.log"
          function Log($m) { "$(Get-Date -Format s)  $m" | Add-Content -Path $log }

          # Limite de tentativas (evita laço de reinicialização se a key for inválida)
          $counter = "C:\OEM\activate.tries"
          $tries = if (Test-Path $counter) { [int](Get-Content $counter) } else { 0 }
          if ($tries -ge 3) { Log "3 tentativas ja feitas; parando. Veja o log."; exit 0 }

          # Espera o compartilhamento do host aparecer (ate ~5 min)
          $paths = @("\\host.lan\Data\activate.key", "\\20.20.20.1\Data\activate.key")
          $key = $null
          for ($i = 0; $i -lt 30 -and -not $key; $i++) {
            foreach ($p in $paths) {
              if (Test-Path $p) { $key = (Get-Content $p -Raw).Trim(); break }
            }
            if (-not $key) { Start-Sleep -Seconds 10 }
          }
          if (-not $key) { Log "Sem activate.key (nenhuma key fornecida). Nada a fazer."; exit 0 }

          # Ja ativado de verdade? (avaliacao nao conta)
          $lic = Get-CimInstance SoftwareLicensingProduct -Filter "ApplicationId='55c92734-d682-4d71-983e-d6ec3f16059f' AND PartialProductKey IS NOT NULL" | Select-Object -First 1
          if ($lic -and $lic.LicenseStatus -eq 1 -and $lic.Description -notmatch 'EVAL') { Log "Windows ja esta ativado."; exit 0 }

          Set-Content -Path $counter -Value ($tries + 1)

          # Windows Server de avaliacao precisa ser convertido de edicao antes de aceitar a key
          $edition = ((dism /online /Get-CurrentEdition) | Select-String 'Current Edition\s*:\s*(\S+)').Matches[0].Groups[1].Value
          if ($edition -match 'Eval$') {
            $target = $edition -replace 'Eval$', ''
            Log "Edicao de avaliacao ($edition) -> convertendo para $target"
            dism /online /Set-Edition:$target /ProductKey:$key /AcceptEula /NoRestart | Out-File -Append $log
            if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 3010) {
              Log "Conversao concluida; reiniciando."
              Restart-Computer -Force
            } else {
              Log "Falha na conversao (codigo $LASTEXITCODE). Confira se a key e da edicao $target."
            }
            exit 0
          }

          # Windows 10/11 ou Server ja convertido
          Log "Instalando key e ativando..."
          cscript //nologo C:\Windows\System32\slmgr.vbs /ipk $key | Out-File -Append $log
          Start-Sleep -Seconds 5
          cscript //nologo C:\Windows\System32\slmgr.vbs /ato | Out-File -Append $log
          Log "Concluido. Resultado acima (nunca registramos a key)."
          OEM_ACTIVATE_PS1

          # Wallpaper: troque a linha abaixo pelo base64 do seu wallpaper.png
          base64 -d > "$OEM/wallpaper.png" 2>/dev/null <<'OEM_WALLPAPER_B64' || true
          COLE_AQUI_O_BASE64_DO_WALLPAPER
          OEM_WALLPAPER_B64
          # Se o base64 não foi colado (ou é inválido), descarta o arquivo vazio
          [ -s "$OEM/wallpaper.png" ] || { rm -f "$OEM/wallpaper.png"; echo "::warning::Wallpaper não embutido; o Windows ficará com o padrão."; }

          # .bat e .ps1 precisam de fim de linha do Windows (CRLF)
          sed -i 's/$/\r/' "$OEM/install.bat" "$OEM/setwall.ps1" "$OEM/activate.ps1"
          ls -l "$OEM"
          file "$OEM/wallpaper.png" || true

      # ─────────────────────────────────────────────
      # 1. ESTADO ANTERIOR (JSON)
      # ─────────────────────────────────────────────
      - name: Restore system state (JSON)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/rdp-state/system-state.json
          key: win-state-${{ env.VERSION_CODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-state-${{ env.VERSION_CODE }}-

      - name: Init state
        run: |
          mkdir -p /home/runner/rdp-state
          echo "STATE_FILE=/home/runner/rdp-state/system-state.json" >> $GITHUB_ENV
          # Hora limite do loop: 315 min após o início (sobra ~45 min para desligar e salvar)
          echo "DEADLINE=$(( $(date +%s) + 18900 ))" >> $GITHUB_ENV
          cat > /home/runner/state.py <<'EOF'
          import json, os, sys, datetime
          p = os.environ["STATE_FILE"]
          now = datetime.datetime.now().astimezone().isoformat()
          s = json.load(open(p)) if os.path.exists(p) else {}
          step = sys.argv[1]
          if step == "init":
              prev = s
              if prev: print("Estado anterior encontrado: execução #%s" % prev.get("run_count"))
              else:    print("Sem estado anterior (primeira execução).")
              s = {
                  "schema": 1,
                  "run_count": int(prev.get("run_count", 0)) + 1,
                  "first_started": prev.get("first_started", now),
                  "started_at": now,
                  "previous_run": ({k: prev.get(k) for k in ("last_update", "ticks", "steps")} if prev else None),
                  "steps": {}, "ticks": 0,
              }
          else:
              s.setdefault("steps", {})
              if step != "-": s["steps"][step] = now
          for kv in sys.argv[2:]:
              k, _, v = kv.partition("=")
              s[k] = int(v) if v.isdigit() else v
          s["last_update"] = now
          os.makedirs(os.path.dirname(p), exist_ok=True)
          json.dump(s, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          STATE_FILE=/home/runner/rdp-state/system-state.json python3 /home/runner/state.py init version=${{ env.VERSION_CODE }} family=${{ env.FAMILY }}

      # ─────────────────────────────────────────────
      # 2. KVM + DISCO + SWAP
      # ─────────────────────────────────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "::error::Este runner não tem /dev/kvm. Use repositório público ou um runner maior."
            exit 1
          fi
          ls -l /dev/kvm
          python3 /home/runner/state.py kvm

      - name: Free disk space + swap
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/windows
          sudo chown -R "$USER" /mnt/windows

          # Swap de 8GB: evita o kernel matar a VM por falta de memória
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h / /mnt
          python3 /home/runner/state.py disk_ready

      # ─────────────────────────────────────────────
      # 3. RESTAURAR APPS E DADOS (disco salvo na Release; não vale para Android)
      # ─────────────────────────────────────────────
      - name: Restore disk (Release)
        if: ${{ inputs.persist && env.FAMILY != 'android' }}
        run: |
          PREFIX="disk-${{ env.VERSION_CODE }}-"
          TAG=$(gh release list --limit 100 --json tagName,createdAt \
                  --jq "[.[] | select(.tagName | startswith(\"$PREFIX\"))] | sort_by(.createdAt) | reverse | .[0].tagName // empty")
          if [ -z "$TAG" ]; then
            echo "Nenhum disco salvo para ${{ env.VERSION_CODE }} (primeira vez: o sistema será instalado)."
            exit 0
          fi
          echo "Restaurando disco da release: $TAG"
          mkdir -p /mnt/parts
          gh release download "$TAG" --pattern 'win.tar.zst.part*' --dir /mnt/parts
          ls -lh /mnt/parts
          cat /mnt/parts/win.tar.zst.part* | zstd -d -T0 | sudo tar -x --sparse -C /mnt
          rm -rf /mnt/parts
          sudo chown -R "$USER" /mnt/windows
          echo "DISK_RESTORED=1" >> $GITHUB_ENV
          python3 /home/runner/state.py disk_restored restored_tag=$TAG
          du -sh /mnt/windows; df -h /mnt

      # ─────────────────────────────────────────────
      # 4. TAILSCALE
      # ─────────────────────────────────────────────
      - name: Connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-${{ env.VERSION_CODE }}-${{ github.run_id }}
          for i in $(seq 1 15); do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -1)
            [ -n "$TS_IP" ] && break
            sleep 4
          done
          [ -z "$TS_IP" ] && { echo "::error::Tailscale sem IP"; exit 1; }
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV
          python3 /home/runner/state.py tailscale_up tailscale_ip=$TS_IP
          echo "Tailscale IP: $TS_IP"

      # ─────────────────────────────────────────────
      # 5. INICIAR A VM NO DOCKER
      # ─────────────────────────────────────────────
      - name: Start VM container
        env:
          IN_USER: ${{ inputs.username }}
          IN_PASS: ${{ inputs.password }}
          IN_RAM: ${{ inputs.ram }}
          IN_CORES: ${{ inputs.cores }}
          IN_DISK: ${{ inputs.disk }}
          WIN_KEY: ${{ secrets.WINDOWS_KEY }}
        run: |
          mkdir -p /home/runner/shared
          VM_ARGS=(--device=/dev/kvm --device=/dev/net/tun --cap-add NET_ADMIN
                   -e RAM_SIZE="$IN_RAM" -e CPU_CORES="$IN_CORES" -e DISK_SIZE="$IN_DISK" -e ALLOCATE=N
                   -v /mnt/windows:/storage --stop-timeout 180)

          case "$FAMILY" in
            windows)
              # Key de ativação (opcional): secret WINDOWS_KEY. Nunca é impressa no log.
              KEY_ARG=()
              if [ -n "$WIN_KEY" ]; then
                (umask 077; printf '%s' "$WIN_KEY" > /home/runner/shared/activate.key)
                KEY_ARG=(-e KEY="$WIN_KEY")   # o dockur usa na instalação
                echo "HAS_KEY=1" >> $GITHUB_ENV
                echo "Key de ativação recebida (secret WINDOWS_KEY)."
              else
                echo "Sem secret WINDOWS_KEY: o Windows fica sem ativar / em avaliação."
              fi
              # Campos vazios no formulário viram CrowCloud
              WIN_USER="${IN_USER:-CrowCloud}"
              WIN_PASS="${IN_PASS:-CrowCloud}"
              echo "WIN_USER=$WIN_USER" >> $GITHUB_ENV
              echo "WIN_PASS=$WIN_PASS" >> $GITHUB_ENV
              # /oem: o install.bat (criado na etapa 0) roda no fim da instalação
              docker run -d --name windows "${VM_ARGS[@]}" \
                -p 8006:8006 -p 3389:3389/tcp -p 3389:3389/udp \
                -e VERSION="$OS_ID" -e USERNAME="$WIN_USER" -e PASSWORD="$WIN_PASS" \
                -v /home/runner/oem:/oem -v /home/runner/shared:/shared \
                "${KEY_ARG[@]}" "$IMAGE"
              ;;
            linux)
              docker run -d --name windows "${VM_ARGS[@]}" \
                -p 8006:8006 -e BOOT="$OS_ID" "$IMAGE"
              ;;
            macos)
              docker run -d --name windows "${VM_ARGS[@]}" \
                -p 8006:8006 -p 5900:5900/tcp \
                -e VERSION="$OS_ID" "$IMAGE"
              ;;
            android)
              docker run -d --name windows --device=/dev/kvm --stop-timeout 60 \
                -p 6080:6080 \
                -e EMULATOR_DEVICE="Samsung Galaxy S10" \
                -e WEB_VNC=true \
                "$IMAGE"
              ;;
          esac
          sleep 10
          docker ps
          python3 /home/runner/state.py container_started

      - name: Show access info
        run: |
          echo ""
          echo "══════════════════════════════════════════════"
          echo "  CROWCLOUD — $FAMILY $OS_ID"
          echo "══════════════════════════════════════════════"
          echo "  NAVEGADOR: http://$TS_IP:$WEB_PORT"
          case "$FAMILY" in
            windows)
              echo "  RDP:       $TS_IP:3389"
              echo "  Usuário:   $WIN_USER"
              echo "  Senha:     $WIN_PASS"
              if [ "$HAS_KEY" = "1" ]; then
                echo "  Ativação:  automática (key do secret)"
              else
                echo "  Ativação:  sem key (crie o secret WINDOWS_KEY)"
              fi
              [ "$DISK_RESTORED" != "1" ] && echo "  Instalação nova (20 a 40 min). Acompanhe pelo navegador."
              ;;
            macos)
              echo "  VNC:       $TS_IP:5900"
              echo "  Instale pelo navegador (Disk Utility > apagar disco > reinstalar macOS)."
              ;;
            linux)
              echo "  O instalador da distro abre no navegador; instale como em um PC normal."
              ;;
            android)
              echo "  Emulador no navegador (sem persistência: dados somem ao encerrar)."
              ;;
          esac
          [ "$DISK_RESTORED" = "1" ] && echo "  Disco RESTAURADO: apps e dados voltaram."
          echo "  Para encerrar COM SEGURANÇA: desligue o sistema por dentro."
          echo "══════════════════════════════════════════════"
          echo ""

      - name: Wait for system
        run: |
          ok=0
          for i in $(seq 1 90); do
            if [ "$FAMILY" = "windows" ]; then
              docker logs windows 2>&1 | grep -qi "Windows started successfully" && { ok=1; break; }
            else
              curl -fs -o /dev/null "http://localhost:$WEB_PORT" && { ok=1; break; }
            fi
            if [ -z "$(docker ps -q -f name=windows)" ]; then
              echo "::error::O contêiner parou."; docker logs --tail 60 windows; exit 1
            fi
            echo "[$(date +%T)] aguardando... $(docker logs --tail 1 windows 2>&1 | tr -d '\r' | cut -c1-100)"
            sleep 60
          done
          if [ "$ok" = "1" ]; then
            echo "PRONTO ✓  -> http://$TS_IP:$WEB_PORT"
            python3 /home/runner/state.py windows_ready
          else
            echo "::warning::Tempo de espera esgotado; o sistema pode ainda estar instalando. Veja pelo navegador."
          fi

      # ─────────────────────────────────────────────
      # 6. MANTER ATIVO (até a hora limite ou o sistema ser desligado)
      # ─────────────────────────────────────────────
      - name: Keep alive
        run: |
          i=0
          END_REASON=timeout
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ -z "$(docker ps -q -f name=windows)" ]; then
              echo "O sistema foi desligado. Salvando tudo..."
              END_REASON=shutdown; break
            fi
            i=$((i+1))
            FREE=$(df -BG /mnt | awk 'NR==2{print $4}')
            LEFT=$(( (DEADLINE - $(date +%s)) / 60 ))
            python3 /home/runner/state.py keepalive ticks=$i disk_free=$FREE
            echo "[$(date +%T)] Ativo — tick $i | /mnt livre: $FREE | restam ~${LEFT} min | http://$TS_IP:$WEB_PORT"
            sleep 300
          done
          [ "$END_REASON" = "timeout" ] && echo "Tempo máximo atingido, encerrando para salvar."
          echo "END_REASON=$END_REASON" >> $GITHUB_ENV

      # ─────────────────────────────────────────────
      # 7. DESLIGAR LIMPO E SALVAR (roda mesmo se cancelar)
      # ─────────────────────────────────────────────
      - name: Stop VM cleanly
        if: always()
        run: |
          python3 /home/runner/state.py ended || true
          docker stop -t 180 windows || true
          rm -f /home/runner/shared/activate.key
          sudo chmod -R a+rX /mnt/windows || true
          du -sh /mnt/windows || true

      - name: Save disk (Release)
        if: ${{ always() && inputs.persist && env.FAMILY != 'android' }}
        run: |
          [ -d /mnt/windows ] || { echo "Sem disco para salvar."; exit 0; }
          # Só salva se o sistema chegou a ser instalado (evita guardar disco vazio)
          if [ ! -f /mnt/windows/data.img ] && [ -z "$(ls -A /mnt/windows 2>/dev/null)" ]; then
            echo "Disco vazio, nada a salvar."; exit 0
          fi
          PREFIX="disk-${{ env.VERSION_CODE }}-"
          NEWTAG="${PREFIX}${{ github.run_id }}"
          rm -rf /mnt/parts; mkdir -p /mnt/parts

          echo "Comprimindo o disco..."
          sudo tar --sparse -C /mnt -cf - windows | zstd -T0 -3 | split -b 1900M -d -a 3 - /mnt/parts/win.tar.zst.part
          ls -lh /mnt/parts

          echo "Enviando para a release $NEWTAG..."
          gh release create "$NEWTAG" /mnt/parts/win.tar.zst.part* \
            --title "Disco da VM (${{ env.VERSION_CODE }}) — run ${{ github.run_id }}" \
            --notes "Disco da VM salvo automaticamente (apps e dados). Não apague: é restaurado na próxima execução." \
            --prerelease --latest=false

          # Só apaga os backups antigos depois que o novo subiu com sucesso
          for old in $(gh release list --limit 100 --json tagName --jq ".[].tagName | select(startswith(\"$PREFIX\"))"); do
            if [ "$old" != "$NEWTAG" ]; then
              echo "Removendo backup antigo: $old"
              gh release delete "$old" -y --cleanup-tag || true
            fi
          done
          python3 /home/runner/state.py disk_saved saved_tag=$NEWTAG || true

      - name: Save system state (JSON)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/rdp-state/system-state.json
          key: win-state-${{ env.VERSION_CODE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-state-${{ env.VERSION_CODE }}
          path: /home/runner/rdp-state/system-state.json
          retention-days: 30

      # ─────────────────────────────────────────────
      # 8. MODO SERVIDOR: começa outra execução sozinho
      #    (só se terminou por tempo; se você desligou o sistema, não reinicia)
      # ─────────────────────────────────────────────
      - name: Restart (server mode)
        if: ${{ success() && inputs.auto_restart && inputs.persist }}
        run: |
          if [ "$END_REASON" = "timeout" ]; then
            echo "Disparando a próxima execução..."
            gh workflow run "${{ github.workflow }}" \
              -f version="${{ inputs.version }}" \
              -f username="${{ inputs.username }}" \
              -f password="${{ inputs.password }}" \
              -f ram="${{ inputs.ram }}" -f cores="${{ inputs.cores }}" -f disk="${{ inputs.disk }}" \
              -f persist=true -f auto_restart=true
          else
            echo "Sistema desligado manualmente: não reinicia."
          fi
